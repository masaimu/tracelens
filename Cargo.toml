[package]
name = "tracelens"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.49.7", default-features = false }

[profile.release]
# Strip symbols at build time on every platform so CI does not depend on a
# platform `strip` command. Keeps the release artifact smaller.
strip = "symbols"
