name: Benchmark

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/fixtures/**
      - tools/generate_synthetic_traces.py
      - tools/run_perf_benchmark.py
      - .github/workflows/benchmark.yml
  schedule:
    - cron: "37 3 * * 2"
  workflow_dispatch:
    inputs:
      spans:
        description: Comma-separated span counts.
        required: true
        default: "5000"
      traces:
        description: Number of traces per generated fixture.
        required: true
        default: "20"
      formats:
        description: Comma-separated input formats.
        required: true
        default: json
      shapes:
        description: Comma-separated synthetic trace shapes.
        required: true
        default: balanced,overlap
      commands:
        description: Comma-separated tracelens commands.
        required: true
        default: validate,summary,list-traces,services,critical-path
      iterations:
        description: Iterations per benchmark case.
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Performance smoke benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-benchmark-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-benchmark-stable-

      - name: Show Python version
        run: python3 --version

      - name: Run benchmark
        env:
          BENCHMARK_SPANS: ${{ github.event.inputs.spans || '5000' }}
          BENCHMARK_TRACES: ${{ github.event.inputs.traces || '20' }}
          BENCHMARK_FORMATS: ${{ github.event.inputs.formats || 'json' }}
          BENCHMARK_SHAPES: ${{ github.event.inputs.shapes || 'balanced,overlap' }}
          BENCHMARK_COMMANDS: ${{ github.event.inputs.commands || 'validate,summary,list-traces,services,critical-path' }}
          BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
        run: |
          python3 tools/run_perf_benchmark.py \
            --spans "$BENCHMARK_SPANS" \
            --traces "$BENCHMARK_TRACES" \
            --formats "$BENCHMARK_FORMATS" \
            --shapes "$BENCHMARK_SHAPES" \
            --commands "$BENCHMARK_COMMANDS" \
            --iterations "$BENCHMARK_ITERATIONS"

      - name: Add benchmark summary
        if: always()
        run: |
          latest_report="$(find perf-results -maxdepth 1 -name '*.md' -print | sort | tail -n 1)"
          if [ -n "$latest_report" ]; then
            cat "$latest_report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: perf-results/
          if-no-files-found: warn
