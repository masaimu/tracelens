name: Release

# Tag push (v*) builds the per-platform artifacts and publishes a GitHub
# Release. A manual workflow_dispatch run only builds and uploads run artifacts
# for rehearsal, without creating a public release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # native builds: the runner can execute the produced binary.
          - os: macos-14
            target: aarch64-apple-darwin
            verify_exec: true
          # x86_64-apple-darwin is cross-compiled on the arm64 macos-14 runner
          # to avoid the supply-constrained macos-13 (Intel) runner queue;
          # it cannot be executed on the build runner without Rosetta.
          - os: macos-14
            target: x86_64-apple-darwin
            verify_exec: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            verify_exec: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            verify_exec: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release artifact + checksum
        run: bash tools/build_release.sh "${{ matrix.target }}"

      - name: Verify artifact
        run: |
          bin="$(ls dist/tracelens-* | grep -v '\.sha256$' | head -1)"
          test -n "$bin"
          if [ "${{ matrix.verify_exec }}" = "true" ]; then
            ./"$bin" --version
          else
            ls -l "$bin"
            file "$bin" 2>/dev/null || true
            echo "cross-target artifact: exec skipped (needs target arch runtime)"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracelens-${{ matrix.target }}
          path: dist/tracelens-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify expected artifacts present
        run: |
          set -e
          echo "Downloaded release files:"
          ls -1 dist/tracelens-*
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            echo "checking $target"
            ls dist/tracelens-*"$target"* >/dev/null
          done

      - name: Publish GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          echo "Publishing release for tag: $tag"
          # If a previous (partial/failed) release already exists for this tag,
          # delete it so we republish from a clean asset set. The git tag itself
          # is unaffected. This avoids the softprops reconcile-delete 404 path
          # that fires when stale asset ids can no longer be resolved.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release for $tag found; deleting to republish cleanly."
            gh release delete "$tag" --yes
          fi
          args=(--title "$tag" --notes-file CHANGELOG.md)
          # Pre-release iff the tag name contains a hyphen (e.g. v0.1.0-rc1).
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          # Single glob: dist/tracelens-* matches both binaries and .sha256
          # sidecars. The previous redundant dist/*.sha256 glob caused each
          # sidecar to be enumerated twice, which triggered softprops asset
          # reconcile-delete 404s on some runs.
          gh release create "$tag" "${args[@]}" dist/tracelens-*
          echo "Published assets:"
          gh release view "$tag" --json assets --jq '.assets[].name'
